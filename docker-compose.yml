services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mcpscan-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Mount code directories for auto-update during development
      - ./shared:/app/shared:ro
      - ./api:/app/api:ro
      - ./results:/app/results
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcpscan-network
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Mount code directories for auto-update during development
      - ./shared:/app/shared:ro
      - ./scanner:/app/scanner:ro
      - ./results:/app/results
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcpscan-network

volumes:
  redis-data:

networks:
  mcpscan-network:
    driver: bridge
