version: '3'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    
  mcpscan-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "6000:6000"
    volumes:
      - ./results:/app/results
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    depends_on:
      - redis

volumes:
  redis_data:
